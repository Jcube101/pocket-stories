variables:
  inventory:
    toolkit: false
    fuel_cell: false
  relationships:
    AI: 0
  flags:
    power_restored: false

passages:
  start:
    text: |
      You wake in a silent orbital outpost. Emergency lights flicker.
    choices:
      - text: "Check engineering"
        target: engineering
      - text: "Call station AI"
        target: ai_room

  engineering:
    text: |
      The reactor is offline. A maintenance toolkit hangs nearby.
    choices:
      - text: "Take toolkit"
        target: reactor
        effect: "inventory.toolkit = true"
      - text: "Return to hub"
        target: start

  ai_room:
    text: |
      The AI avatar appears. "Restore power and I'll open the hangar."
    choices:
      - text: "Promise to help"
        target: reactor
        effect: "relationships.AI += 2"
      - text: "Ignore and leave"
        target: start

  reactor:
    text: |
      The access panel is jammed.
    choices:
      - text: "Pry panel with toolkit"
        target: battery_bay
        condition: "inventory.toolkit == true"
      - text: "Keep searching"
        target: cargo

  cargo:
    text: |
      You find a spare fuel cell in a crate.
    choices:
      - text: "Take fuel cell"
        target: battery_bay
        effect: "inventory.fuel_cell = true"

  battery_bay:
    text: |
      The backup battery bay hums faintly.
    choices:
      - text: "Install fuel cell"
        target: restored
        condition: "inventory.fuel_cell == true"
        effect: "flags.power_restored = true"
      - text: "Go back"
        target: reactor

  restored:
    text: |
      Power returns. The AI unlocks the hangar doors.
    choices:
      - text: "Launch the shuttle"
        target: good_end
        condition: "flags.power_restored == true"

  good_end:
    text: |
      You escape the outpost just as debris rains from orbit. You survived.
    choices: []
