variables:
  inventory:
    badge: false
    evidence: false
  relationships:
    Informant: 0
  flags:
    bribed_guard: false

passages:
  start:
    text: |
      Rain hammers the neon streets. You stand outside the Velvet Club.
    choices:
      - text: "Flash your badge"
        target: bouncer
        effect: "inventory.badge = true"
      - text: "Take alley shortcut"
        target: alley

  bouncer:
    text: |
      The bouncer squints at you.
    choices:
      - text: "Demand entry"
        target: club_floor
        condition: "inventory.badge == true"
      - text: "Slip him cash"
        target: club_floor
        effect: "flags.bribed_guard = true"

  alley:
    text: |
      Your informant waits in the shadows with a sealed envelope.
    choices:
      - text: "Take envelope"
        target: club_floor
        effect: "inventory.evidence = true"
      - text: "Ask for details"
        target: alley_talk
        effect: "relationships.Informant += 2"

  alley_talk:
    text: |
      "Top floor office," the informant whispers. "Don't trust the bartender."
    choices:
      - text: "Enter through back door"
        target: club_floor

  club_floor:
    text: |
      Music pounds. Your suspect vanishes upstairs.
    choices:
      - text: "Confront suspect now"
        target: bad_end
      - text: "Search office first"
        target: office

  office:
    text: |
      You find ledgers tied to the city council.
    choices:
      - text: "Expose the conspiracy"
        target: good_end
        condition: "inventory.evidence == true"
      - text: "Walk away"
        target: neutral_end

  good_end:
    text: |
      Your report breaks the case open. The city finally listens.
    choices: []

  neutral_end:
    text: |
      You keep your job, but the truth stays buried.
    choices: []

  bad_end:
    text: |
      The suspect was ready. You never make it out of the club.
    choices: []
