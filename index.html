<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocket Stories</title>
    <script>
      // Restore path redirected from 404.html for GitHub Pages SPA support.
      (function() {
        var q = window.location.search;
        if (q && q.slice(1, 3) === 'p=') {
          var path = decodeURIComponent(q.slice(3).split('&h=')[0]);
          var hash = q.includes('&h=') ? '#' + decodeURIComponent(q.split('&h=')[1]) : '';
          window.history.replaceState(null, '', '/' + path + hash);
        }
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
